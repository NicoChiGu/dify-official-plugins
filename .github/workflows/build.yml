name: Build Dify Plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      model:
        description: "Model Name"
        required: true
      version:
        description: "Version (e.g. v1.0.0)"
        required: true
        default: "1.0.0"
      release:
        description: "Publish to Release?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐳 Setup Docker Compose
        uses: docker/setup-buildx-action@v2

      - name: 🪝 Clone openai_api_compatible
        run: |
          mkdir -p ./models
          git clone https://github.com/NicoChiGu/openai_api_compatible ./models/openai_api_compatible
          
      - name: Download latest Dify CLI
        run: |
          # 选择 Linux AMD64
          DIFY_CLI_URL="https://github.com/langgenius/dify-plugin-daemon/releases/download/0.5.4/dify-plugin-linux-amd64"
          curl -L -o dify-cli "$DIFY_CLI_URL"
          chmod +x dify-cli
          sudo mv dify-cli /usr/local/bin/dify
          
      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip

      - name: 📚 Install project deps
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi   
          
      - name: 📚 Install model deps
        run: |
          MODEL="${{ github.event.inputs.model }}"
          if [ -f "./models/$MODEL/requirements.txt" ]; then
            pip install -r "./models/$MODEL/requirements.txt"
          fi
          
      - name: 🏷 Determine version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi
          
      # 🏗 打包
      - name: 🏗 Build plugin
        run: |
          MODEL="${{ github.event.inputs.model }}"
          mkdir -p ./dist
          dify plugin package "models/$MODEL" --output_path "./dist/$MODEL.difypkg"

      - name: 📦 Prepare offline packager
        run: |
          MODEL="${{ github.event.inputs.model }}"
          # 拉取 dify-plugin-offline-packager 仓库
          git clone https://github.com/kurokobo/dify-plugin-offline-packager ./offline-packager
          
          # 进入 packager 目录
          cd offline-packager
          ls $GITHUB_WORKSPACE
          ls $GITHUB_WORKSPACE/dist

          # 运行 Docker Compose 打包
          docker compose run --rm \
            -v "$GITHUB_WORKSPACE/dist:/dist" \
            packager --local "/dist/$MODEL.difypkg"

      - name: 🔍 Check dist
        run: ls -lah offline-packager/difypkg

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dify-plugin-${{ github.event.inputs.model }}-${{ env.VERSION }}
          path: |
            offline-packager/difypkg/*.difypkg

      - name: 🚀 Create Release
        if: |
          (github.event_name == 'push') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ github.event.inputs.model }} - ${{ env.VERSION }}
          files: |
            offline-packager/difypkg/*.difypkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
