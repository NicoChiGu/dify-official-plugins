name: Build Dify Plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      model:
        description: "Model Name"
        required: true
      version:
        description: "Version (e.g. v1.0.0)"
        required: true
        default: "1.0.0"
      release:
        description: "Publish to Release?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐳 Setup Docker Compose
        uses: docker/setup-buildx-action@v2

      - name: 🪝 Clone openai_api_compatible
        run: |
          mkdir -p ./models
          git clone https://github.com/NicoChiGu/openai_api_compatible ./models/openai_api_compatible

      - name: 🏷 Determine version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: 📦 Prepare offline packager
        run: |
          # 拉取 dify-plugin-offline-packager 仓库
          git clone https://github.com/kurokobo/dify-plugin-offline-packager ./offline-packager

          # 进入 packager 目录
          cd offline-packager

          # 拷贝要打包的模型插件
          MODEL="${{ github.event.inputs.model }}"
          mkdir -p ./plugins
          cp -r ../models/$MODEL ./plugins/$MODEL

          # 创建输出目录
          mkdir -p ./output

          # 设置版本
          echo ${{ env.VERSION }} > ./plugins/$MODEL/version.txt

          # 运行 Docker Compose 打包
          docker compose run --rm packager bash -c "
            set -e
            echo '=== Building plugin $MODEL ==='
            ./pack.sh plugins/$MODEL output/$MODEL.difypkg
          "

      - name: 🔍 Check dist
        run: ls -lah offline-packager/output

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dify-plugin-${{ github.event.inputs.model }}-${{ env.VERSION }}
          path: offline-packager/output/*

      - name: 🚀 Create Release
        if: |
          (github.event_name == 'push') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          files: offline-packager/output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
