name: Build Dify Plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      model:
        description: "Model Name"
        required: true
      version:
        description: "Version (e.g. v1.0.0)"
        required: true
        default: "1.0.0"
      release:
        description: "Publish to Release?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Download latest Dify CLI
        run: |
          # 选择 Linux AMD64
          DIFY_CLI_URL="https://github.com/langgenius/dify-plugin-daemon/releases/download/0.5.4/dify-plugin-linux-amd64"
          curl -L -o dify-cli "$DIFY_CLI_URL"
          chmod +x dify-cli
          sudo mv dify-cli /usr/local/bin/dify

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip

      - name: 📚 Install project deps
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 🪝 拉取其他仓库到 ./models/openai_api_compatible
      - name: 📂 Clone openai_api_compatible
        run: |
          mkdir -p ./models
          git clone https://github.com/NicoChiGu/openai_api_compatible ./models/openai_api_compatible
          
      - name: 📚 Install model deps
        run: |
          MODEL="${{ github.event.inputs.model }}"
          if [ -f "./models/$MODEL/requirements.txt" ]; then
            pip install -r "./models/$MODEL/requirements.txt"
          fi

      # 🏷 统一版本号来源
      - name: 🏷 Determine version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi
          
      # 🏗 Prepare UV environment and pre-install deps
      - name: 🏗 Pre-install dependencies in plugin
        run: |
          MODEL="${{ github.event.inputs.model }}"
          mkdir -p ./dist

          # 创建临时虚拟环境
          VENV_DIR=".venv-$MODEL"
          python -m venv "$VENV_DIR"
          source "$VENV_DIR/bin/activate"

          # 升级 pip 并安装插件依赖
          pip install --upgrade pip
          if [ -f "models/$MODEL/requirements.txt" ]; then
            pip install -r "models/$MODEL/requirements.txt"
          fi
          
          # 安装 dify-plugin 本身
          pip install dify-plugin

          # 打包插件，同时把虚拟环境一起打进去
          dify plugin package "models/$MODEL" \
            --output_path "./dist/$MODEL.difypkg" \
            --include-venv "$VENV_DIR"

          # 清理虚拟环境
          deactivate
          rm -rf "$VENV_DIR"

      # 🔍 Debug
      - name: 🔍 Check dist
        run: ls -lah dist

      # 📦 上传构建产物（始终执行）
      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dify-plugin-${{ github.event.inputs.model }}-${{ env.VERSION }}
          path: |
            dist/*.difypkg
            dist/*.difybndl

      # 🚀 条件发布 Release（核心）
      - name: 🚀 Create Release
        if: |
          (github.event_name == 'push') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          files: |
            dist/*.difypkg
            dist/*.difybndl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
